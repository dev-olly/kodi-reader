name: Verify Release

# Release packages are built and notarized on the signing Mac.
# CI verifies the published package without replacing it with an unsigned build.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - name: Download published DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern KodiReader.dmg

      - name: Verify signature and Apple notarization
        run: |
          codesign --verify --verbose=2 KodiReader.dmg
          details="$(codesign --display --verbose=4 KodiReader.dmg 2>&1)"
          printf '%s\n' "$details"
          printf '%s\n' "$details" | grep -F 'Authority=Developer ID Application: Emmanuel Onyebueke (3FJF74RW5L)'
          xcrun stapler validate KodiReader.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 KodiReader.dmg
