[package]
name = "kodi-desktop-services"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["native-audio"]
native-audio = ["dep:cpal"]
speech = ["dep:sherpa-onnx"]

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
cpal = { version = "0.15", optional = true }
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[dev-dependencies]
kodi-reader-core = { path = "../reader-core" }

[[example]]
name = "verify_speech"
required-features = ["speech"]

[[example]]
name = "verify_recording_recovery"

