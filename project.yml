name: KodiReader
options:
  bundleIdPrefix: com.olly
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Xcode 16 introduced project format 77, which earlier Xcodes refuse to open.
  # The 15.3 format is readable by every Xcode from 15 through 26, so the
  # project builds regardless of which toolchain is selected.
  projectFormat: xcode15_3

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.2
  EpubReaderCore:
    path: .

configFiles:
  Debug: Config/Auth.xcconfig
  Release: Config/Auth.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      # Keep local development builds independent of distribution credentials.
      CODE_SIGN_IDENTITY: "-"

targets:
  # Deliberately not "Books", which would collide with Apple's own app in
  # Spotlight, the Dock, and `open -a`.
  KodiReader:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: Supabase
        product: Auth
      - package: EpubReaderCore
        product: EpubKit
      - package: EpubReaderCore
        product: ReaderUI
    settings:
      base:
        PRODUCT_NAME: Kodi Reader
        PRODUCT_BUNDLE_IDENTIFIER: com.olly.KodiReader
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/KodiReader.entitlements
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          DEVELOPMENT_TEAM: 3FJF74RW5L
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_ENTITLEMENTS: App/KodiReader.release.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  KodiReaderAuthTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AuthTests
      - path: App/AI/AIAuthController.swift
      - path: App/AI/AIChatService.swift
      - path: App/AI/AIModelConfig.swift
      - path: App/AI/AIConfigStore.swift
      - path: App/AI/ChatController.swift
      - path: App/AppDataDirectory.swift
      - path: App/LegacyFolioMigration.swift
    dependencies:
      - package: EpubReaderCore
        product: EpubKit
      - package: Supabase
        product: Auth
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KodiReader:
    build:
      targets:
        KodiReader: all
    test:
      targets:
        - KodiReaderAuthTests
